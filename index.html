<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOUNDYOU - ระบบช่วยค้นหาของหาย</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased">

    <div class="flex min-h-screen">
        <!-- SIDEBAR -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between p-4 shrink-0 hidden md:flex">
            <div>
                <div class="flex items-center space-x-2 text-white font-bold text-xl tracking-wider mb-6 px-2">
                    <i class="fa-solid fa-box-open text-blue-500"></i>
                    <span>FOUNDYOU</span>
                </div>
                <nav class="space-y-1 text-sm font-medium">
                    <a href="#" onclick="showPage('home-page')" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-blue-600 text-white">
                        <i class="fa-solid fa-house w-5"></i>
                        <span>หน้าแรก</span>
                    </a>
                    <a href="#" onclick="showPage('report-page')" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 transition">
                        <i class="fa-solid fa-file-circle-plus w-5"></i>
                        <span>แจ้งของหาย</span>
                    </a>
                    <a href="#" onclick="showPage('status-page')" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 transition">
                        <i class="fa-solid fa-clock-rotate-left w-5"></i>
                        <span>เช็กสถานะ/คำตอบ</span>
                    </a>
                </nav>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 flex flex-col min-w-0">
            <!-- TOP NAVBAR -->
            <header class="bg-white border-b px-6 py-3 flex items-center justify-between sticky top-0 z-10">
                <div class="flex items-center space-x-4 flex-1 max-w-lg">
                    <input type="text" placeholder="ค้นหาของหาย..." class="w-full bg-gray-100 rounded-lg pl-4 pr-4 py-2 text-sm focus:outline-none">
                </div>
                <div class="flex items-center space-x-2 border-l pl-4">
                    <div class="w-8 h-8 rounded-full bg-blue-900 text-white flex items-center justify-center font-bold text-sm">น</div>
                    <span class="text-xs font-semibold">สวัสดี, ผู้ใช้งาน</span>
                </div>
            </header>

            <!-- VIEW 1: HOME PAGE -->
            <main id="home-page" class="p-6 space-y-6 max-w-6xl mx-auto w-full">
                <div class="bg-slate-900 rounded-2xl p-6 text-white flex justify-between items-center shadow-md">
                    <div>
                        <h1 class="text-3xl font-bold mb-2">FOUNDYOU</h1>
                        <p class="text-sm text-gray-300 mb-4">ระบบช่วยค้นหาของหาย บันทึกข้อมูลตรงลง Google Sheets</p>
                        <div class="flex space-x-3">
                            <button onclick="showPage('report-page')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm">แจ้งของหาย</button>
                            <button onclick="showPage('status-page')" class="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-lg text-sm border border-white/20">เช็กการตอบกลับ</button>
                        </div>
                    </div>
                </div>
            </main>

            <!-- VIEW 2: REPORT PAGE -->
            <main id="report-page" class="p-6 max-w-2xl mx-auto w-full hidden">
                <button onclick="showPage('home-page')" class="text-xs text-gray-500 mb-4"><i class="fa-solid fa-arrow-left mr-1"></i> ย้อนกลับ</button>
                <div class="bg-white p-6 rounded-xl border shadow-sm space-y-4">
                    <h2 class="font-bold text-lg">ฟอร์มแจ้งของหาย</h2>
                    <div>
                        <label class="block text-xs font-semibold mb-1">ประเภทของหาย *</label>
                        <select id="form-category" class="w-full border rounded-lg p-2 text-xs">
                            <option>อุปกรณ์อิเล็กทรอนิกส์</option>
                            <option>กระเป๋า / เป้</option>
                            <option>เอกสาร / บัตร</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">ชื่อของหาย *</label>
                        <input type="text" id="form-name" placeholder="เช่น AirPods Pro" class="w-full border rounded-lg p-2 text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">ยี่ห้อ / รายละเอียดเพิ่มเติม</label>
                        <input type="text" id="form-brand" placeholder="เช่น เคสสีดำ มีสติ๊กเกอร์" class="w-full border rounded-lg p-2 text-xs">
                    </div>
                    <button onclick="submitData()" id="btn-submit" class="w-full bg-blue-900 text-white py-2 rounded-lg text-xs font-medium">บันทึกข้อมูลลง Google Sheet</button>
                </div>
            </main>

            <!-- VIEW 3: STATUS & REPLY PAGE -->
            <main id="status-page" class="p-6 max-w-4xl mx-auto w-full hidden">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-lg">สถานะและการตอบกลับจากเจ้าของเว็บ</h2>
                    <button onclick="fetchStatus()" class="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded"><i class="fa-solid fa-rotate mr-1"></i> อัปเดตข้อมูล</button>
                </div>
                <div id="status-container" class="space-y-3">
                    <p class="text-xs text-gray-400">กำลังโหลดข้อมูล...</p>
                </div>
            </main>
        </div>
    </div>

    <script>
        // URL Google Apps Script ของคุณ
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWsIm7SEPFZNNs10hn2AFqPvRAKVCyMe5qPRC4Hp0hVB_i1snt9PueRFjDSICXch08-A/exec";

        function showPage(pageId) {
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('report-page').classList.add('hidden');
            document.getElementById('status-page').classList.add('hidden');
            document.getElementById(pageId).classList.remove('hidden');
            if(pageId === 'status-page') fetchStatus();
        }

        async function submitData() {
            const category = document.getElementById('form-category').value;
            const itemName = document.getElementById('form-name').value;
            const brand = document.getElementById('form-brand').value;
            const btn = document.getElementById('btn-submit');

            if(!itemName) return alert('กรุณากรอกชื่อของหาย');

            btn.disabled = true;
            btn.innerText = 'กำลังบันทึกข้อมูล...';

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category, itemName, brand })
                });
                alert('บันทึกข้อมูลสำเร็จ!');
                document.getElementById('form-name').value = '';
                document.getElementById('form-brand').value = '';
                showPage('status-page');
            } catch (error) {
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
            } finally {
                btn.disabled = false;
                btn.innerText = 'บันทึกข้อมูลลง Google Sheet';
            }
        }

        async function fetchStatus() {
            const container = document.getElementById('status-container');
            container.innerHTML = '<p class="text-xs text-gray-400">กำลังดึงข้อมูลล่าสุด...</p>';

            try {
                const res = await fetch(GOOGLE_SCRIPT_URL);
                const data = await res.json();
                
                if(data.length === 0) {
                    container.innerHTML = '<p class="text-xs text-gray-400">ยังไม่มีรายการแจ้งของหาย</p>';
                    return;
                }

                container.innerHTML = data.map(item => `
                    <div class="bg-white p-4 rounded-xl border shadow-sm space-y-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[10px] bg-blue-100 text-blue-800 px-2 py-0.5 rounded">${item.category}</span>
                                <h4 class="font-bold text-sm mt-1">${item.itemName} (${item.brand || 'ไม่ระบุ'})</h4>
                            </div>
                            <span class="text-[10px] text-gray-400">${new Date(item.timestamp).toLocaleString('th-TH')}</span>
                        </div>
                        <div class="bg-amber-50 p-3 rounded-lg border border-amber-200 mt-2">
                            <p class="text-xs font-semibold text-amber-900"><i class="fa-solid fa-message mr-1"></i> ตอบกลับจากแอดมิน / นัดรับ:</p>
                            <p class="text-xs text-amber-800 mt-0.5">${item.ownerReply}</p>
                        </div>
                    </div>
                `).reverse().join('');
            } catch (error) {
                container.innerHTML = '<p class="text-xs text-red-500">ไม่สามารถโหลดข้อมูลได้</p>';
            }
        }
    </script>
</body>
</html>
